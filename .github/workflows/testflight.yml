name: TestFlight

# By hand (Actions › TestFlight › Run workflow): builds the iPhone app (with the watch app and the
# widgets), signs it for the App Store and uploads it to App Store Connect, for TestFlight.
#
# Needs a paid Apple developer account, the app set up in App Store Connect (bundle ID
# nz.aaronrumpler.setPilot), and these repository secrets:
#   DEVELOPMENT_TEAM   your Team ID (10 characters)
#   ASC_KEY_ID         an App Store Connect API key's ID (Users and Access › Integrations; App Manager role)
#   ASC_ISSUER_ID      its issuer ID
#   ASC_KEY_P8         the key's .p8 file, base64
# Signing is automatic: Xcode makes the certificate and profiles with the API key.

on:
  workflow_dispatch:
    inputs:
      icloud:
        description: Build with iCloud (sync, Handoff, the iCloud Drive folder)
        type: boolean
        default: true

jobs:
  iphone:
    runs-on: macos-26
    env:
      TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit stamp uses git describe
      - name: Secrets
        run: |
          if [ -z "$TEAM" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Set DEVELOPMENT_TEAM, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (see the top of this file)."
            exit 1
          fi
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        run: |
          xcodebuild archive -project setPilot.xcodeproj -scheme "setPilot iOS" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/setPilot.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            WIZ_ICLOUD=${{ inputs.icloud && 'YES' || 'NO' }}
      - name: Upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/setPilot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}: it shows in TestFlight once App Store Connect has processed it." >> "$GITHUB_STEP_SUMMARY"
