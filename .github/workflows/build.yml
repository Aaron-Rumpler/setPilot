name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      variants:
        description: Also compile with every other combination of App Groups and iCloud (on or off) from Account.xcconfig
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Build
        run: |
          xcodebuild -project setPilot.xcodeproj -target setPilot -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build
      - name: Check signature, entitlements and commit
        run: |
          codesign --verify --strict --verbose=2 build/Release/setPilot.app
          codesign -d --entitlements - build/Release/setPilot.app
          /usr/libexec/PlistBuddy -c "Print :SetPilotCommit" build/Release/setPilot.app/Contents/Info.plist
          # The command-line tool, inside the app.
          test -x build/Release/setPilot.app/Contents/Helpers/setpilot
          # And its widgets (with App Groups on).
          ls build/Release/setPilot.app/Contents/PlugIns/setPilotMacWidgets.appex > /dev/null
      - name: Tests
        run: |
          xcodebuild -project setPilot.xcodeproj -target setPilotTests -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
          SNAPSHOT_DIR="$RUNNER_TEMP/snapshots" xcrun xctest build/Release/setPilotTests.xctest
      - name: Widget pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      - name: UI tests
        run: |
          xcodebuild test -project setPilot.xcodeproj -scheme setPilot -destination 'platform=macOS' \
            -only-testing:setPilotUITests -derivedDataPath build/uitests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Build for iPhone (with the watch app)
        run: |
          xcodebuild -project setPilot.xcodeproj -scheme "setPilot iOS" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          app=build/ios/Build/Products/Release-iphoneos/setPilot.app
          ls "$app/PlugIns/setPilotWidgets.appex" "$app/Watch/setPilot.app/PlugIns/setPilotWatchWidgets.appex" > /dev/null
      - name: Zip
        run: ditto -c -k --keepParent build/Release/setPilot.app setPilot.zip
      - uses: actions/upload-artifact@v7
        with:
          name: setPilot
          path: setPilot.zip

  variants:
    if: github.event_name == 'workflow_dispatch' && inputs.variants
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Mac with iCloud
        run: |
          xcodebuild -project setPilot.xcodeproj -target setPilot -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= WIZ_ICLOUD=YES build
      - name: Mac without App Groups
        run: |
          # Its own build folder: the one above has the widgets in the app.
          xcodebuild -project setPilot.xcodeproj -target setPilot -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= SYMROOT="$PWD/build/no-groups" \
            WIZ_APP_GROUPS=NO build
          # Without App Groups the widgets are left out.
          test ! -e build/no-groups/Release/setPilot.app/Contents/PlugIns/setPilotMacWidgets.appex
      - name: Mac with iCloud, without App Groups
        run: |
          xcodebuild -project setPilot.xcodeproj -target setPilot -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= SYMROOT="$PWD/build/icloud-no-groups" \
            WIZ_ICLOUD=YES WIZ_APP_GROUPS=NO build
          test ! -e build/icloud-no-groups/Release/setPilot.app/Contents/PlugIns/setPilotMacWidgets.appex
      - name: iPhone and watch with iCloud, without App Groups
        run: |
          xcodebuild -project setPilot.xcodeproj -scheme "setPilot iOS" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO \
            WIZ_ICLOUD=YES WIZ_APP_GROUPS=NO build
          # Without App Groups the widgets are left out.
          app=build/ios/Build/Products/Release-iphoneos/setPilot.app
          test ! -e "$app/PlugIns/setPilotWidgets.appex"
          test ! -e "$app/Watch/setPilot.app/PlugIns/setPilotWatchWidgets.appex"
      - name: iPhone and watch without iCloud or App Groups
        run: |
          # What a free account builds (Account.xcconfig): no iCloud, and App Groups off if signing fails.
          xcodebuild -project setPilot.xcodeproj -scheme "setPilot iOS" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios-plain CODE_SIGNING_ALLOWED=NO \
            WIZ_ICLOUD=NO WIZ_APP_GROUPS=NO build
          app=build/ios-plain/Build/Products/Release-iphoneos/setPilot.app
          test ! -e "$app/PlugIns/setPilotWidgets.appex"
          test ! -e "$app/Watch/setPilot.app/PlugIns/setPilotWatchWidgets.appex"
      - name: iPhone and watch with iCloud and App Groups
        run: |
          xcodebuild -project setPilot.xcodeproj -scheme "setPilot iOS" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios-groups CODE_SIGNING_ALLOWED=NO \
            WIZ_ICLOUD=YES WIZ_APP_GROUPS=YES build
          app=build/ios-groups/Build/Products/Release-iphoneos/setPilot.app
          ls "$app/PlugIns/setPilotWidgets.appex" "$app/Watch/setPilot.app/PlugIns/setPilotWatchWidgets.appex" > /dev/null
