name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build app bundle
        run: ./build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent setPilot.app setPilot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: setPilot
          path: setPilot.zip
